# Triton platform JSON rehberi (Turkce)
# Bu YAML dosyasi yalnizca dokumantasyondur. Triton bunu platform verisi olarak okumaz.
# Dosya silinirse plugin baslangicinda veya /triton reload sonrasinda yeniden olusturulur.

rehber:
  klasor: "plugins/Triton/platforms"
  veri_dosyalari: "Bu klasordeki tum .json dosyalari yuklenir; yalnizca default.json degil."
  onemli_kurallar:
    - "Gercek veriyi .json dosyasina yazin. tutorial_tr.yml ve tutorial_en.yml etkisizdir."
    - "JSON yorum, sondaki fazla virgul veya ayni nesnede tekrarlanan anahtar kabul etmez."
    - "type degeri platform, key degeri benzersiz bir metin anahtari olmalidir."
    - "variants icinde java ve bedrock alanlari istege baglidir; en az biri gecerli olmalidir."

  kullanim:
    etiket: "[plat]rank.youtuber[/plat]"
    arguman: "[plat]welcome[arg]Oyuncu[/arg][/plat]"
    placeholderapi: "%triton_plat_rank.youtuber%"
    not: "plat ve arg adlari config.yml > platform-variants altindaki syntax-lang ve syntax-arg ile degistirilebilir."

  deger_bicimleri:
    eski_tek_metin: "java veya bedrock degeri dogrudan string olabilir; tum diller ayni metni gorur."
    dile_ozel_nesne: "java veya bedrock degeri, config.yml icindeki dil adlarini anahtar kullanan bir nesne olabilir."
    varsayilan_dil: "Dile ozel nesnede opsiyonel default anahtari son dil fallback'i olarak kullanilabilir."
    karisik_kullanim: "Ornegin java dile ozel nesne, bedrock ise eski tek string olabilir."

  fallback_sirasi:
    - "Oyuncunun secili dili (ornegin tr_TR)."
    - "Secili dilin config.yml icindeki fallback-languages sirasi."
    - "config.yml icindeki main-language."
    - "Varsa dile ozel nesnedeki default alani."
    - "Secili platformda sonuc yoksa ayni sira diger platformda denenir."
    - "Hicbir sonuc bulunamazsa normal Triton eksik-ceviri davranisi uygulanir."

  desteklenen_icerik:
    - "Legacy renk ve bicim kodlari: &a, &l, &#RRGGBB ve benzerleri."
    - "MiniMessage: [minimsg] on eki veya otomatik algilanan <green>, <#RRGGBB>, <image:...> gibi etiketler."
    - "Adventure JSON component: [triton_json] on eki."
    - "Argumanlar: metin icindeki %1, %2 degerleri [arg]...[/arg] sirasi ile doldurulur."
    - "Ic ice dil cevirisi: platform metninin icinde [lang]baska.anahtar[/lang] kullanilabilir."
    - "Guvenlik: safe-translations aciksa guvenilmeyen argumanlardaki click eventleri temizlenir."

  opsiyonel_twin:
    aciklama: "_twin Triton TWIN senkronizasyon metadatasidir; elle yazilan yerel dosyalarda gerekli degildir."
    alanlar: "id, dateCreated, dateUpdated, archived, tags, description"
    archived: "true ise oge yuklenmez."

ornek_eski_format: |-
  {
    "items": [
      {
        "type": "platform",
        "key": "rank.youtuber",
        "variants": {
          "java": "[minimsg]<!shadow><white><image:wellsetups_ranks:youtuber></white></!shadow>",
          "bedrock": "[minimsg]<#ff3030><bold>YOUTUBER</bold>"
        }
      }
    ]
  }

ornek_coklu_dil: |-
  {
    "items": [
      {
        "type": "platform",
        "key": "rank.youtuber",
        "variants": {
          "java": {
            "tr_TR": "[minimsg]<!shadow><white><image:wellsetups_ranks:youtuber></white></!shadow>",
            "en_US": "[minimsg]<!shadow><white><image:wellsetups_ranks:youtuber_en></white></!shadow>",
            "default": "[minimsg]<white><bold>YOUTUBER</bold>"
          },
          "bedrock": {
            "tr_TR": "[minimsg]<#ff3030><bold>YAYINCI</bold>",
            "en_US": "[minimsg]<#ff3030><bold>YOUTUBER</bold>"
          }
        }
      },
      {
        "type": "platform",
        "key": "welcome",
        "variants": {
          "java": {
            "tr_TR": "&aHos geldin, %1! [lang]server.name[/lang]",
            "en_US": "&aWelcome, %1! [lang]server.name[/lang]"
          },
          "bedrock": "&b%1, sunucuya hos geldin!"
        }
      }
    ]
  }
